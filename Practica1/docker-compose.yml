services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ss2-practica1-sqlserver
    hostname: ss2-practica1-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_MEMORY_LIMIT_MB: "2048"

    ports:
      - "127.0.0.1:14330:1433"

    volumes:
      - ss2_practica1_sqlserver_data:/var/opt/mssql

    mem_limit: 3g

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -Q 'SELECT 1' >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  ss2_practica1_sqlserver_data:
    name: ss2_practica1_sqlserver_data
