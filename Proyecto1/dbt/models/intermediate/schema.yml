version: 2

models:
  - name: int_venta_detalle_enriquecida
    description: >-
      Una fila por id_detalle, con atributos de la venta y del producto
      relacionados. Conserva las medidas y los metadatos técnicos del detalle.
    columns:
      - name: id_detalle
        description: "Clave natural del detalle de venta y grano del modelo."
        tests: [not_null, unique]
      - name: id_venta
        description: "Clave de la venta padre, proveniente del detalle."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_venta')
                field: id_venta
      - name: id_producto
        description: "Clave del producto padre, proveniente del detalle."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_producto')
                field: id_producto
      - name: cantidad
        description: "Cantidad original del detalle; no se recalcula."
      - name: precio_unitario
        description: "Precio unitario original del detalle; no se recalcula."
      - name: descuento
        description: "Descuento original del detalle; no se deriva."
      - name: subtotal
        description: "Subtotal original del detalle; no se sobrescribe."
      - name: fecha
        description: "Fecha no nula de la venta padre."
        tests: [not_null]
      - name: id_cliente
        description: "Cliente no nulo de la venta padre."
        tests: [not_null]
      - name: id_sucursal
        description: "Sucursal no nula de la venta padre."
        tests: [not_null]
      - name: canal
        description: "Canal no nulo de la venta padre; no se filtra."
        tests: [not_null]
      - name: metodo_pago
        description: "Método de pago no nulo de la venta padre."
        tests: [not_null]
      - name: estado
        description: "Estado no nulo de la venta padre; no se filtra."
        tests: [not_null]
      - name: sku
        description: "SKU no nulo del producto padre."
        tests: [not_null]
      - name: nombre_producto
        description: "Nombre no nulo del producto padre."
        tests: [not_null]
      - name: id_categoria
        description: "Categoría no nula del producto padre."
        tests: [not_null]
      - name: id_marca
        description: "Marca no nula del producto padre."
        tests: [not_null]
      - name: unidad_medida
        description: "Unidad de medida no nula del producto padre."
        tests: [not_null]
      - name: _etl_load_id
        description: "Metadato técnico conservado exclusivamente del detalle."
      - name: _etl_loaded_at
        description: "Instante de carga del detalle."
      - name: _etl_source_table
        description: "Tabla de origen del detalle."
      - name: _etl_extracted_at
        description: "Instante de extracción del detalle."

  - name: int_inventario_snapshot
    description: >-
      Una fila por fecha_corte, id_sucursal, id_producto y lote. Conserva
      stocks, vencimiento y metadatos del snapshot de inventario, y agrega
      atributos descriptivos de producto y sucursal sin alterar el grano.
    columns:
      - name: fecha_corte
        description: "Fecha del corte histórico del inventario; parte de la clave compuesta."
        tests: [not_null]
      - name: id_sucursal
        description: "Sucursal del inventario; parte de la clave compuesta."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_sucursal')
                field: id_sucursal
      - name: id_producto
        description: "Producto del inventario; parte de la clave compuesta."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_producto')
                field: id_producto
      - name: lote
        description: "Lote del inventario; parte de la clave compuesta."
        tests: [not_null]
      - name: stock_disponible
        description: "Existencia disponible original del snapshot; no se reemplaza ni agrega entre cortes."
      - name: stock_minimo
        description: "Stock mínimo reportado originalmente; no se interpreta como regla comercial."
      - name: stock_maximo
        description: "Stock máximo reportado originalmente; no se interpreta como regla comercial."
      - name: fecha_vencimiento
        description: "Fecha de vencimiento original; puede ser NULL si es desconocida."
      - name: _etl_load_id
        description: "Identificador técnico de carga conservado desde inventario."
      - name: _etl_loaded_at
        description: "Instante técnico de carga conservado desde inventario."
      - name: _etl_source_name
        description: "Archivo de procedencia conservado desde inventario."
      - name: _etl_source_sha256
        description: "Huella SHA-256 de procedencia conservada desde inventario."
      - name: _etl_row_number
        description: "Fila original del archivo conservada desde inventario."
      - name: sku
        description: "SKU obligatorio del producto padre."
        tests: [not_null]
      - name: nombre_producto
        description: "Nombre obligatorio del producto padre."
        tests: [not_null]
      - name: nombre_sucursal
        description: "Nombre obligatorio de la sucursal padre."
        tests: [not_null]
      - name: es_vencido_en_corte
        description: "TRUE solo cuando fecha_vencimiento es anterior a fecha_corte; NULL si se desconoce."
      - name: dias_para_vencer
        description: "Diferencia fecha_vencimiento - fecha_corte; admite negativos, cero el mismo día y NULL sin vencimiento."

  - name: int_devoluciones_enriquecida
    description: >-
      Una fila por id_devolucion, conservando las seis columnas funcionales
      y los cinco metadatos técnicos del CSV. Enriquece únicamente con
      atributos de la venta y del producto relacionados; no calcula importes
      ni ventas netas.
    columns:
      - name: id_devolucion
        description: "Clave natural y grano del modelo: una fila por devolución."
        tests: [not_null, unique]
      - name: fecha
        description: "Fecha original de la devolución; conserva su nombre y valor."
        tests: [not_null]
      - name: id_venta
        description: "Venta asociada en el CSV de devoluciones."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_venta')
                field: id_venta
      - name: id_producto
        description: "Producto asociado en el CSV de devoluciones."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_producto')
                field: id_producto
      - name: cantidad
        description: "Cantidad original devuelta; no se altera ni se agrega."
        tests: [not_null]
      - name: motivo
        description: "Motivo original de la devolución; no se normaliza."
        tests: [not_null]
      - name: _etl_load_id
        description: "Identificador técnico de carga conservado del CSV."
        tests: [not_null]
      - name: _etl_loaded_at
        description: "Instante técnico de carga conservado del CSV."
        tests: [not_null]
      - name: _etl_source_name
        description: "Archivo de procedencia conservado del CSV."
        tests: [not_null]
      - name: _etl_source_sha256
        description: "Huella SHA-256 de procedencia conservada del CSV."
        tests: [not_null]
      - name: _etl_row_number
        description: "Fila original del archivo conservada del CSV."
        tests: [not_null]
      - name: fecha_venta
        description: "Fecha de la venta padre, diferenciada de la fecha de devolución."
        tests: [not_null]
      - name: id_cliente
        description: "Cliente obligatorio de la venta padre."
        tests: [not_null]
      - name: id_sucursal
        description: "Sucursal obligatoria de la venta padre."
        tests: [not_null]
      - name: canal
        description: "Canal obligatorio de la venta padre; no se filtra."
        tests: [not_null]
      - name: metodo_pago
        description: "Método de pago obligatorio de la venta padre."
        tests: [not_null]
      - name: estado
        description: "Estado obligatorio de la venta padre; no se filtra."
        tests: [not_null]
      - name: sku
        description: "SKU obligatorio del producto padre."
        tests: [not_null]
      - name: nombre_producto
        description: "Nombre obligatorio del producto padre."
        tests: [not_null]
      - name: id_categoria
        description: "Categoría obligatoria del producto padre."
        tests: [not_null]
      - name: id_marca
        description: "Marca obligatoria del producto padre."
        tests: [not_null]
      - name: unidad_medida
        description: "Unidad de medida obligatoria del producto padre."
        tests: [not_null]

  - name: int_ventas_mensuales_sucursal
    description: >-
      Una fila por periodo mensual e id_sucursal, agregada desde los detalles
      de venta enriquecidos. Las medidas representan registros del sistema:
      no son ventas oficiales, ingresos contables, ventas netas ni métricas
      de cumplimiento comercial.
    columns:
      - name: periodo
        description: "Primer día del mes en que se registró la venta; grano temporal del modelo."
        tests: [not_null]
      - name: id_sucursal
        description: "Sucursal del registro de venta; parte del grano mensual-sucursal."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_sucursal')
                field: id_sucursal
      - name: lineas_registradas
        description: "COUNT(*) de líneas registradas en el mes y sucursal."
        tests: [not_null]
      - name: ventas_distintas_registradas
        description: "COUNT(DISTINCT id_venta) de ventas registradas en el mes y sucursal."
        tests: [not_null]
      - name: cantidad_registrada
        description: "SUM(cantidad) original de las líneas registradas; no se recalcula ni se convierte en una medida oficial."
        tests: [not_null]
      - name: subtotal_registrado
        description: "SUM(subtotal) original de las líneas registradas; no equivale necesariamente a ingreso oficial."
        tests: [not_null]
