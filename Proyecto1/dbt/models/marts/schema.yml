version: 2

models:
  - name: fct_ventas_detalle
    description: >-
      Hecho de detalles de venta registrados. Su grano es una fila por
      id_detalle y conserva las claves naturales, medidas y metadatos técnicos
      del modelo intermediate de procedencia. No aplica filtros comerciales,
      cálculos monetarios ni relaciones con otros hechos.
    columns:
      - name: id_detalle
        description: "Clave natural y grano del hecho: una fila por detalle de venta."
        tests: [not_null, unique]
      - name: id_venta
        description: "Clave natural de la venta padre."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_venta')
                field: id_venta
      - name: id_producto
        description: "Clave natural del producto vendido."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_producto')
                field: id_producto
      - name: id_cliente
        description: "Clave natural del cliente de la venta; futura relación dimensional."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_cliente')
                field: id_cliente
      - name: id_sucursal
        description: "Clave natural de la sucursal de la venta; futura relación dimensional."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_sucursal')
                field: id_sucursal
      - name: fecha
        description: "Fecha registrada de la venta; futura relación con una dimensión calendario."
        tests: [not_null]
      - name: cantidad
        description: "Cantidad original registrada; medida potencialmente aditiva según el contexto."
        tests: [not_null]
      - name: precio_unitario
        description: "Precio unitario original; medida no aditiva y no debe sumarse."
        tests: [not_null]
      - name: descuento
        description: "Descuento original del OLTP; su unidad semántica se conserva sin inferirla."
        tests: [not_null]
      - name: subtotal
        description: "Subtotal original registrado; medida potencialmente aditiva según reglas posteriores."
        tests: [not_null]
      - name: _etl_load_id
        description: "Identificador técnico de carga conservado desde el detalle."
        tests: [not_null]
      - name: _etl_loaded_at
        description: "Instante técnico de carga conservado desde el detalle."
        tests: [not_null]
      - name: _etl_source_table
        description: "Tabla OLTP de procedencia conservada desde el detalle."
        tests: [not_null]
      - name: _etl_extracted_at
        description: "Instante técnico de extracción conservado desde el detalle."
        tests: [not_null]

  - name: dim_sucursal
    description: >-
      Dimensión de sucursales disponible en el origen. Su fuente es
      stg_oltp_sucursal y su grano es exactamente una fila por id_sucursal,
      que actúa como clave natural. Conserva los atributos originales y los
      metadatos técnicos ETL sin joins ni filtros. Se relaciona 1:N con
      fct_ventas_detalle mediante id_sucursal. Describe el estado disponible
      en el origen; no demuestra historia de sucursales ni implementa SCD2
      porque el contrato no contiene una historia confiable.
    columns:
      - name: id_sucursal
        description: "Clave natural y grano de la dimensión: una fila por sucursal."
        tests: [not_null, unique]
      - name: nombre
        description: "Nombre original de la sucursal."
        tests: [not_null]
      - name: ciudad
        description: "Ciudad original de la sucursal."
        tests: [not_null]
      - name: departamento
        description: "Departamento original de la sucursal."
        tests: [not_null]
      - name: _etl_load_id
        description: "Identificador técnico de carga conservado desde staging."
        tests: [not_null]
      - name: _etl_loaded_at
        description: "Instante técnico de carga conservado desde staging."
        tests: [not_null]
      - name: _etl_source_table
        description: "Tabla de procedencia conservada desde staging."
        tests: [not_null]
      - name: _etl_extracted_at
        description: "Instante técnico de extracción conservado desde staging."
        tests: [not_null]

  - name: dim_fecha
    description: >-
      Dimensión calendario con una fila por día calendario dentro del rango
      dinámico determinado por las fechas no nulas de stg_oltp_venta.fecha y
      int_ventas_mensuales_sucursal.periodo. La clave natural es fecha, de
      tipo DATE. El modelo incluye todos los días entre los límites, incluso
      los que no tienen ventas. Las partes del calendario siguen la convención
      gregoriana; dia_semana y numero_semana usan ISO, al igual que anio_iso.
      Si ambas fuentes no tienen fechas válidas, el rango es vacío y la vista
      no crea filas artificiales. La cobertura se limita al mínimo y máximo de
      esas dos fuentes: no incluye devoluciones, snapshots de inventario,
      vencimientos futuros ni fechas técnicas ETL. Las relaciones desde hechos
      hacia esta dimensión son posibles por fecha, pero no se declara una
      relación inversa obligatoria porque los días sin ventas son válidos.
    columns:
      - name: fecha
        description: "Clave natural DATE; una fila por día calendario del rango autorizado."
        tests: [not_null, unique]
      - name: anio
        description: "Año gregoriano de fecha."
        tests: [not_null]
      - name: anio_iso
        description: "Año ISO-8601 al que pertenece la semana de fecha."
        tests: [not_null]
      - name: trimestre
        description: "Trimestre gregoriano de fecha, de 1 a 4."
        tests: [not_null]
      - name: mes
        description: "Mes gregoriano de fecha, de 1 a 12."
        tests: [not_null]
      - name: dia_mes
        description: "Día del mes gregoriano."
        tests: [not_null]
      - name: dia_semana
        description: "Día ISO de la semana: lunes 1 a domingo 7."
        tests: [not_null]
      - name: numero_semana
        description: "Número de semana ISO-8601."
        tests: [not_null]
      - name: inicio_mes
        description: "Primer día del mes gregoriano."
        tests: [not_null]
      - name: fin_mes
        description: "Último día del mes gregoriano."
        tests: [not_null]
      - name: inicio_trimestre
        description: "Primer día del trimestre gregoriano."
        tests: [not_null]
      - name: inicio_anio
        description: "Primer día del año gregoriano."
        tests: [not_null]
      - name: es_fin_semana
        description: "TRUE para sábado o domingo ISO; FALSE para lunes a viernes."
        tests: [not_null]

  - name: dim_producto
    description: >-
      Dimensión de productos disponible en el origen. Su fuente única es
      stg_oltp_producto y su grano es exactamente una fila por id_producto,
      que actúa como clave natural. Conserva atributos comerciales, estado y
      metadatos técnicos ETL sin joins, filtros, cálculos ni deduplicación.
      Se relaciona 1:N con fct_ventas_detalle mediante id_producto y conserva
      también productos sin ventas. id_categoria e id_marca mantienen sus
      relaciones naturales hacia staging. costo_base y precio_lista son
      valores disponibles en origen, no precios históricos de venta ni costos
      vendidos. El contrato no contiene historia confiable, por lo que no se
      implementa SCD2 ni se crean registros históricos artificiales.
    columns:
      - name: id_producto
        description: "Clave natural y grano de la dimensión: una fila por producto."
        tests: [not_null, unique]
      - name: sku
        description: "SKU original, único y no nulo según el DDL de origen."
        tests: [not_null, unique]
      - name: nombre
        description: "Nombre comercial original del producto."
        tests: [not_null]
      - name: id_categoria
        description: "Clave natural de categoría del producto."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_categoria')
                field: id_categoria
      - name: id_marca
        description: "Clave natural de marca del producto."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oltp_marca')
                field: id_marca
      - name: unidad_medida
        description: "Unidad de medida original del producto."
        tests: [not_null]
      - name: costo_base
        description: "Costo base original; no se recalcula ni se interpreta como costo vendido."
        tests: [not_null]
      - name: precio_lista
        description: "Precio de lista original; no se presenta como precio histórico de venta."
        tests: [not_null]
      - name: activo
        description: "Indicador de actividad registrado en origen."
        tests: [not_null]
      - name: _etl_load_id
        description: "Identificador técnico de carga conservado desde staging."
        tests: [not_null]
      - name: _etl_loaded_at
        description: "Instante técnico de carga conservado desde staging."
        tests: [not_null]
      - name: _etl_source_table
        description: "Tabla OLTP de procedencia conservada desde staging."
        tests: [not_null]
      - name: _etl_extracted_at
        description: "Instante técnico de extracción conservado desde staging."
        tests: [not_null]
